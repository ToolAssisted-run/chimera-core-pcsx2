name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package.
#
# What this job can prove on a public runner is bounded by content. A
# PlayStation 2 needs a bios, and a retail one is somebody's dump. So the
# core gate runs its bios tier on OpenPS2BIOS, an open, MIT-licensed
# replacement built here from the extern/openps2bios submodule (pinned at its
# v0.2 release, checked against the bytes upstream released), and on
# chimera-padtest, this repository's own test program on its own disc
# (tests/own): both flavors build and agree, the machine runs, savestates
# round-trip, the pads reach the machine button by button, the light gun
# empties its socket, the renderers draw, on the processor and through the
# GPU bridges to Mesa's software OpenGL and Vulkan (llvmpipe and lavapipe:
# no graphics card, so these prove the bridges answer every call, not what a
# card draws), and a project opened by Chimera's own runner, chimera-run, can
# go back to frame 0 and still draw. What OpenPS2BIOS cannot do (read
# the pad from its own boot screen, read a memory card back, an interlaced
# picture, an executable with no disc) reports SKIP and says why, and runs by
# hand against the developer's own retail bios, as does everything that needs
# a game's disc (waterbox/run-gate.sh says so on every line).

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. The nightly schedule and a push to
# main are the same workflow on the same ref, so without the event in the key
# whichever starts second cancels the first - and because the publish depends
# on the gate that was cancelled, the release is skipped with nothing anywhere
# reporting a failure. They collide at all because GitHub runs these crons
# hours late: this one asks for 04:00 and starts around 08:30. A push still
# supersedes an older push on the same ref, which is what cancel-in-progress
# is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    name: core gate (builds, refuses without a bios, runs on OpenPS2BIOS, GPU bridges on software drivers)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        # The second line is for Chimera's engine (chimera-run, which the
        # tests that open a project use) and for the GPU bridges' host half
        # in run-wbx (EGL); the third is what those draw on here, Mesa's
        # software OpenGL (llvmpipe) and Vulkan (lavapipe), with the Vulkan
        # loader.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3 bison flex pkg-config python3-mako python3-packaging \
            cmake libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev \
            libegl-mesa0 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers

      - name: Check out miniBox and the rest of Chimera's submodules
        # all of them: the engine is built below, for chimera-run
        working-directory: chimera-checkout
        run: |
          git submodule update --init --recursive

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the guest Mesa (softpipe + OSMesa) the GL renderer links
        # This core fetches and builds its own, pinned by SHA256 to mesa
        # 24.0.9 - Chimera used to carry it as a submodule and does not any
        # more. bash, not sh: the script uses `set -o pipefail`.
        run: bash waterbox/setup-mesa.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox"

      - name: Install LLVM 23 (OpenPS2BIOS is built with it)
        # apt.llvm.org's LLVM 23, as upstream builds its releases with: another
        # LLVM compiles the BIOS into other bytes, and build-openps2bios.sh
        # checks them against the release's
        run: |
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-23 lld-23 llvm-23

      - name: Build OpenPS2BIOS (the open bios the gate's bios tier runs on)
        run: sh waterbox/build-openps2bios.sh

      - name: Build the native reference and sandbox drivers
        # -Dgl_bridge=true: run-wbx carries the GPU bridges' host half, so the
        # gpu: and vk: checks run instead of saying SKIP
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox" -Dgl_bridge=true
          ninja -C build/meson-native

      - name: Build the waterbox core
        run: |
          MINIBOX_DIR="$PWD/chimera-checkout/extern/chimera-common-minibox" sh waterbox/setup-guest.sh \
            -- -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox" \
               -Dmesa_guest_dir="$PWD/build/mesa"
          ninja -C build/meson-guest

      - name: Build Chimera's engine (chimera-run)
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build the package and install it into that Chimera
        # for the checks that open a project through chimera-run
        # (ports:columns, gl:*, vk:picture-after-load). The frontend gate
        # builds the one that is published.
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: Core gate
        run: CHIMERA_ROOT="$PWD/chimera-checkout" ./waterbox/run-gate.sh

      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx
          path: |
            build/meson-guest/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-gate:
    # The other half: the package running inside the real frontend (Chimera's
    # window, run headless, through the generic waterbox adapter). The
    # package accepts OpenPS2BIOS as a Boot ROM, so its checks run on it, with
    # this repository's own test disc; the one that needs the console's
    # default retail bios says SKIP. This job also BUILDS the package, which is
    # what publishes the artifact and proves the packaging is deterministic.
    name: frontend gate (Chimera)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build build-essential cmake pkg-config python3 bison flex \
            libgl1-mesa-dev libx11-dev libxext-dev libasound2-dev python3-mako python3-packaging

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Build the native reference
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          # run-native only: the frontend gate compares Chimera against the
          # native reference and never runs the sandbox driver.
          ninja -C build/meson-native run-native

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the guest Mesa (softpipe + OSMesa) the GL renderer links
        # This core fetches and builds its own, pinned by SHA256 to mesa
        # 24.0.9 - Chimera used to carry it as a submodule and does not any
        # more. bash, not sh: the script uses `set -o pipefail`.
        run: bash waterbox/setup-mesa.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox"

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: Install LLVM 23 (OpenPS2BIOS is built with it)
        # apt.llvm.org's LLVM 23, as upstream builds its releases with: another
        # LLVM compiles the BIOS into other bytes, and build-openps2bios.sh
        # checks them against the release's
        run: |
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-23 lld-23 llvm-23

      - name: Build OpenPS2BIOS (the open bios the frontend gate runs on)
        run: sh waterbox/build-openps2bios.sh

      - name: Frontend gate
        run: ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Publish the core package
        uses: actions/upload-artifact@v7
        with:
          name: pcsx2-${{ github.sha }}
          path: chimera-checkout/build/Cores/pcsx2.chimeraCore
          if-no-files-found: error

      - name: Upload the frontend work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work
          path: waterbox/tests/work/

  publish:
    # What the gates passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run. Chimera ships no cores and downloads none: a user
    # downloads the package from here and puts it in Chimera's Cores folder.
    #
    # The logic is Chimera's tools/publish-core.sh, called through one reusable
    # workflow, so all fifteen cores publish the same way and there is one place
    # to change it.
    name: publish
    needs: [ core-gate, frontend-gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: pcsx2
      artifact: pcsx2-${{ github.sha }}
      package: pcsx2.chimeraCore
      kind: ${{ github.event.inputs.kind }}
